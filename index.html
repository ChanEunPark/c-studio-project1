<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --stone-1: #fbfaf9;
      --stone-3: #f2f1ef;
      --stone-5: #e1dedb;
      --neutral-8: #bdbab0;
      --primary-6: #104eaa;
      --text-85: rgba(11, 11, 11, 0.85);
      --text-60: rgba(11, 11, 11, 0.6);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--stone-5); color: var(--text-85);
      font-family: "Hanken Grotesk", system-ui, sans-serif; font-size: 16px; line-height: 24px;
      padding: 96px 16px;
    }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-family: "Newsreader", Georgia, serif; font-weight: 400; font-size: 48px; line-height: normal; margin: 0 0 8px; }
    .lead { color: var(--text-60); margin: 0 0 40px; }
    .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .page {
      display: flex; flex-direction: column; gap: 8px; padding: 24px; border-radius: 16px;
      background: var(--stone-3); border: 1px solid var(--neutral-8); color: inherit; text-decoration: none;
    }
    .page:hover { border-color: var(--primary-6); }
    .page h2 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 24px; line-height: 34px; margin: 0; }
    .page p { margin: 0; color: var(--text-60); }
    .page span { margin-top: 8px; color: var(--primary-6); }
  </style>
</head>
<body>
  <main>
    <h1>C Studio</h1>
    <p class="lead">Design studio project prototypes.</p>
    <div class="pages">
      <!-- Add a card here for each new page folder -->
      <a class="page" href="courseeditor/">
        <h2>Course Editor</h2>
        <p>Professor side — upload and edit course information.</p>
        <span>Open prototype →</span>
      </a>
      <a class="page" href="courseinfo/">
        <h2>Course Information</h2>
        <p>Student view — the published course page.</p>
        <span>Open prototype →</span>
      </a>
      <a class="page" href="student/">
        <h2>Course Planner</h2>
        <p>Student side — find, compare and plan courses.</p>
        <span>Open prototype →</span>
      </a>
    </div>
  </main>
</body>
</html>
